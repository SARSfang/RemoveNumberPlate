name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    # The v1.2.0 payload includes the optional HD runtime, so model
    # conversion, two PyInstaller builds and installer compression take
    # materially longer than the standard-only release.
    timeout-minutes: 120
    env:
      HAS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 != '' }}
      WINDOWS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Rebuild pinned model artifacts
        shell: pwsh
        run: |
          python -m venv .model-venv
          # paddle2onnx 2.1.0 rejects the PyPI paddlepaddle 3.0.0 wheel on
          # Windows; the official nightly dev20250426 is the proven combo
          # (paddle.__version__ reports 3.0.0, matching manifest.json).
          .\.model-venv\Scripts\python.exe -m pip install `
            paddlepaddle==3.0.0.dev20250426 paddle2onnx==2.1.0 polygraphy packaging `
            --extra-index-url https://www.paddlepaddle.org.cn/packages/nightly/cpu/
          .\.model-venv\Scripts\python.exe -m scripts.build_models
          .\.venv\Scripts\python.exe -m scripts.verify_models

      - name: Fetch the optional Big-LaMa weight
        shell: pwsh
        run: |
          # big_lama_hd_optional is disabled in the manifest, so build_models
          # intentionally skips it. The release bundles the optional HD
          # runtime, so the weight has to be fetched and verified explicitly.
          $Destination = "models\big-lama.pt"
          $Expected = "344c77bbcb158f17dd143070d1e789f38a66c04202311ae3a258ef66667a9ea9"
          if (Test-Path -LiteralPath $Destination) {
            $Actual = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Actual -eq $Expected) {
              Write-Output "Big-LaMa weight already present and verified."
              exit 0
            }
            Remove-Item -LiteralPath $Destination -Force
          }
          Invoke-WebRequest `
            -Uri "https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt" `
            -OutFile $Destination
          $Actual = (Get-FileHash -LiteralPath $Destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Actual -ne $Expected) {
            Remove-Item -LiteralPath $Destination -Force
            throw "Big-LaMa checksum mismatch: $Actual"
          }

      - name: Install high-resolution runtime build dependencies
        shell: pwsh
        run: |
          # The HD worker is frozen from an independent environment so that the
          # standard runtime never has to ship PyTorch.
          python -m venv .venv-hd
          .\.venv-hd\Scripts\python.exe -m pip install --upgrade pip
          # CPU-only wheels: the release bundle must not depend on a GPU or on
          # the CUDA runtime being present on the target machine.
          .\.venv-hd\Scripts\python.exe -m pip install `
            -r requirements-hd.txt "pyinstaller>=6.16,<7" `
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Build the high-resolution runtime component
        shell: pwsh
        run: .\packaging\build_hd_component.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $Installer = "$env:RUNNER_TEMP\innosetup-7.0.2-x64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" `
            -OutFile $Installer
          $Expected = "5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1"
          $Actual = (Get-FileHash $Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Actual -ne $Expected) { throw "Inno Setup hash mismatch." }
          $Signature = Get-AuthenticodeSignature $Installer
          if ($Signature.Status -ne "Valid") { throw "Inno Setup signature invalid." }
          $Process = Start-Process $Installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/CURRENTUSER"
            ) `
            -Wait -PassThru
          if ($Process.ExitCode -ne 0) {
            throw "Inno Setup install failed: $($Process.ExitCode)"
          }

      - name: Decode signing certificate
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\codesign.pfx",
            [Convert]::FromBase64String(
              "${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}"
            )
          )

      - name: Note unsigned tag release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SIGNING_CERTIFICATE != 'true'
        shell: pwsh
        run: Write-Output "::warning::Building unsigned release for $env:GITHUB_REF_NAME (no signing certificate configured)."

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $Expected = "v" + (
            python -c "from app.version import __version__; print(__version__)"
          )
          if ($env:GITHUB_REF_NAME -ne $Expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match $Expected."
          }

      - name: Build signed release
        if: env.HAS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          .\packaging\build_release.ps1 `
            -PfxPath "$env:RUNNER_TEMP\codesign.pfx" `
            -PfxPassword "$env:WINDOWS_SIGN_CERTIFICATE_PASSWORD" `
            -RequireSignature

      - name: Build unsigned release
        if: env.HAS_SIGNING_CERTIFICATE != 'true'
        shell: pwsh
        run: .\packaging\build_release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove decoded certificate
        if: always() && env.HAS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\codesign.pfx" -Force -ErrorAction SilentlyContinue

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub strips non-ASCII characters from release asset names, so
          # publish the installer under an ASCII-safe name and keep
          # SHA256SUMS.txt consistent with it.
          $installer = Get-ChildItem "dist/installer" -Filter "*-Setup-*.exe" |
            Select-Object -First 1
          $asciiName = "RemoveNumberPlate-Setup-$env:GITHUB_REF_NAME-win64.exe"
          Copy-Item $installer.FullName "dist/installer/$asciiName" -Force
          $sums = (Get-Content "dist/installer/SHA256SUMS.txt" -Raw) `
            -replace [regex]::Escape($installer.Name), $asciiName
          Set-Content "dist/installer/SHA256SUMS.txt" $sums -NoNewline
          gh release create "$env:GITHUB_REF_NAME" `
            --verify-tag `
            --title "消除车牌 $env:GITHUB_REF_NAME" `
            --notes-file RELEASE.md `
            "dist/installer/$asciiName" `
            dist/installer/SHA256SUMS.txt
