[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remove-number-plate"
version = "0.1.0"
description = "Offline batch license-plate removal for automotive photographers"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "onnxruntime==1.23.2",
    "opencv-python-headless==4.10.0.84",
    "Pillow>=10.0,<13",
    "piexif>=1.1.3,<2",
    "platformdirs>=4.0,<5",
    "pyclipper>=1.3,<2",
    "PySide6>=6.7,<7",
    "shapely>=2.0,<3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "model: requires locally installed model artifacts and an inference runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["app/domain", "app/core", "app/infrastructure"]

[[tool.mypy.overrides]]
module = ["piexif.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cv2.*", "paddle.*", "pyclipper.*", "shapely.*"]
ignore_missing_imports = true
